[project]
name = "lumonox-workspace"
version = "0.0.0"
description = "Monorepo root for Lumonox tooling"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "lumonox-sdk",
    "lumonox",
    "dotenv>=0.9.9",
    "pytz>=2026.1.post1",
]

[tool.uv.sources]
lumonox-sdk = { workspace = true }
lumonox = { workspace = true }

[tool.uv.workspace]
members = ["sdk", "backend"]

[dependency-groups]
dev = [
    "ruff>=0.8.0",
    "mypy>=1.11.0",
    "types-psutil>=6.1.0.20241221",
    "bandit[toml]>=1.7.8",
    "pytest>=8.3.0",
    "pytest-cov>=6.2.1",
    "pytest-asyncio>=0.24.0",
    "pre-commit>=4.0.0",
    "pip-audit>=2.7.0",
    # Required to exercise the lumonox.django adapter from sdk/tests/.
    "django>=4.2",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["sdk/src", "backend/src"]
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
# FastAPI dependency defaults use `Query(...)` / `Depends(...)` calls (B008); keep explicit here.
"backend/src/lumonox_backend/dashboard/routes/traces.py" = ["B008"]
# Alembic autogenerate emits long single-line DDL.
"backend/src/lumonox_backend/alembic/versions/*.py" = ["E501"]
# SDK supports Python >=3.10 so it cannot use ``datetime.UTC`` (3.11+); keep
# ``timezone.utc`` even though ruff's py311 target-version would prefer the alias.
# See ``docs/plans/sdk-install-ease.md`` Phase 1.
"sdk/src/lumonox/**/*.py" = ["UP017"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["sdk/tests", "backend/tests"]
addopts = "-q"

[tool.coverage.run]
# Default measurement scope mirrors the CI `--cov=lumonox --cov=lumonox_backend` flags,
# so local `uv run pytest --cov` (without explicit `--cov=...`) measures the same hot paths.
source = ["sdk/src/lumonox", "backend/src/lumonox_backend"]
# Exclude generated or boilerplate code from the coverage metric so `fail_under` reflects
# behavior that tests can actually exercise (Alembic revisions are skipped under mypy too).
omit = [
    "*/alembic/versions/*",
    "*/__main__.py",
    "*/conftest.py",
]

[tool.coverage.report]
fail_under = 36
show_missing = true
skip_covered = true

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["lumonox", "lumonox_backend"]
mypy_path = "sdk/src:backend/src"
explicit_package_bases = true
namespace_packages = true

[[tool.mypy.overrides]]
module = "lumonox_backend.alembic.*"
# Alembic revision modules use dynamic SQLAlchemy typing patterns; keep them out of strict checks.
ignore_errors = true

[[tool.mypy.overrides]]
# Django ships without ``py.typed``; ``django-stubs`` would add ~10 MB of transitive deps to
# the dev environment for a feature (the lumonox.django adapter) that is intentionally
# loosely-typed at the Django boundary. Silence missing-imports for ``django.*`` instead.
module = ["django.*"]
ignore_missing_imports = true

[tool.bandit]
targets = ["sdk/src/lumonox", "backend/src/lumonox_backend"]
skips = ["B101"]
