[project]
name = "autopulse-workspace"
version = "0.0.0"
description = "Monorepo root for AutoPulse tooling"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "autopulse",
    "autopulse-backend",
    "dotenv>=0.9.9",
    "pytz>=2026.1.post1",
]

[tool.uv.sources]
autopulse = { workspace = true }
autopulse-backend = { workspace = true }

[tool.uv.workspace]
members = ["sdk", "backend"]

[dependency-groups]
dev = [
    "ruff>=0.8.0",
    "mypy>=1.11.0",
    "bandit[toml]>=1.7.8",
    "pytest>=8.3.0",
    "pre-commit>=4.0.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["sdk/src", "backend/src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["sdk/tests", "backend/tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["autopulse", "autopulse_backend"]
mypy_path = "sdk/src:backend/src"
explicit_package_bases = true
namespace_packages = true

[tool.bandit]
targets = ["sdk/src/autopulse", "backend/src/autopulse_backend"]
skips = ["B101"]
