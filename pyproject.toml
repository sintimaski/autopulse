[project]
name = "lumonox-workspace"
version = "0.0.0"
description = "Monorepo root for Lumonox tooling"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "lumonox-sdk",
    "lumonox-api",
    "dotenv>=0.9.9",
    "pytz>=2026.1.post1",
]

[tool.uv.sources]
lumonox-sdk = { workspace = true }
lumonox-api = { workspace = true }

[tool.uv.workspace]
members = ["sdk", "backend"]

[dependency-groups]
dev = [
    "ruff>=0.8.0",
    "mypy>=1.11.0",
    "types-psutil>=6.1.0.20241221",
    "bandit[toml]>=1.7.8",
    "pytest>=8.3.0",
    "pytest-cov>=6.2.1",
    "pre-commit>=4.0.0",
    "pip-audit>=2.7.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["sdk/src", "backend/src"]
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
# FastAPI dependency defaults use `Query(...)` / `Depends(...)` calls (B008); keep explicit here.
"backend/src/lumonox_backend/dashboard/routes/traces.py" = ["B008"]
# Alembic autogenerate emits long single-line DDL.
"backend/src/lumonox_backend/alembic/versions/*.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["sdk/tests", "backend/tests"]
addopts = "-q"

[tool.coverage.report]
fail_under = 35
show_missing = true
skip_covered = true

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["lumonox", "lumonox_backend"]
mypy_path = "sdk/src:backend/src"
explicit_package_bases = true
namespace_packages = true

[[tool.mypy.overrides]]
module = "lumonox_backend.alembic.*"
# Alembic revision modules use dynamic SQLAlchemy typing patterns; keep them out of strict checks.
ignore_errors = true

[tool.bandit]
targets = ["sdk/src/lumonox", "backend/src/lumonox_backend"]
skips = ["B101"]
