[project]
name = "autopulse"
version = "0.1.0"
description = "FastAPI observability SDK for AutoPulse"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "psutil>=6.0.0",
]

[project.optional-dependencies]
embedded = [
    # Local dashboard + ingest; requires ``autopulse-backend`` on your index (e.g. PyPI) or install both wheels from the repo (see ``scripts/build_sdk_release_wheels.sh``).
    "autopulse-backend>=0.1.0",
]

[build-system]
requires = ["hatchling>=1.26.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autopulse"]
