[project]
name = "autopulse"
version = "0.1.0"
description = "FastAPI observability SDK for AutoPulse"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling>=1.26.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autopulse"]
