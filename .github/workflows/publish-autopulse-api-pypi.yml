# Publishes the ``autopulse-api`` distribution (FastAPI API + bundled Next static export under ``/autopulse/ui/``).
# PyPI project name is ``autopulse-api`` because ``autopulse`` is already taken by an unrelated package.
#
# Runs on pushes to ``main`` when backend or frontend sources change; uploads only when ``backend/pyproject.toml``
# ``version`` is not yet on PyPI (bump version to cut a release).
#
# Manual: Actions → Publish autopulse-api to PyPI → Run workflow.
#
# One-time PyPI: create project ``autopulse-api`` → trusted publisher for this workflow (environment ``pypi`` if used).
name: Publish autopulse-api to PyPI

on:
  push:
    branches: [main]
    paths:
      - "backend/pyproject.toml"
      - "backend/src/**"
      - "frontend/**"
      - ".github/workflows/publish-autopulse-api-pypi.yml"
  workflow_dispatch:

concurrency:
  group: autopulse-api-pypi-publish
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/autopulse-api/
    permissions:
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Decide whether to publish
        id: decide
        run: |
          set -euo pipefail
          VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('backend/pyproject.toml', 'rb'))['project']['version'])")
          echo "autopulse_api_version=${VERSION}"
          CODE=$(curl -sS -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/autopulse-api/${VERSION}/json")
          echo "pypi_version_probe_http=${CODE}"
          if [ "${CODE}" = "200" ]; then
            echo "publish=false" >> "${GITHUB_OUTPUT}"
            echo "::notice::Skipping PyPI upload: autopulse-api ${VERSION} already exists on PyPI. Bump backend/pyproject.toml version to release."
          elif [ "${CODE}" = "404" ]; then
            echo "publish=true" >> "${GITHUB_OUTPUT}"
            echo "::notice::Will publish autopulse-api ${VERSION} to PyPI."
          else
            echo "::error::Unexpected PyPI response (${CODE}) for autopulse-api ${VERSION}; not publishing."
            exit 1
          fi

      - name: Setup Node.js
        if: steps.decide.outputs.publish == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build dashboard static export
        if: steps.decide.outputs.publish == 'true'
        env:
          NEXT_PUBLIC_AUTOPULSE_API_BASE_URL: "http://127.0.0.1:8000"
          NEXT_PUBLIC_AUTOPULSE_DEV_API_ORIGIN: "http://127.0.0.1:8000"
        run: |
          npm ci
          npm run build
        working-directory: frontend

      - name: Install uv
        if: steps.decide.outputs.publish == 'true'
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Build sdist + wheel (bundled dashboard)
        if: steps.decide.outputs.publish == 'true'
        run: uv build backend --out-dir dist

      - name: Verify wheel contains dashboard export
        if: steps.decide.outputs.publish == 'true'
        run: |
          set -euo pipefail
          whl="$(ls dist/autopulse_api-*-py3-none-any.whl | head -1)"
          unzip -l "$whl" | grep -Fq "autopulse_backend/dashboard_static/index.html"

      - name: Upload to PyPI
        if: steps.decide.outputs.publish == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
