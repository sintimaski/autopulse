name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # CI policy:
  # - python-sqlite = full baseline gate
  # - python-postgres = required optional-path backend gate
  python-sqlite:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite+aiosqlite:///./lumonox_ci.db
      BACKEND_TEST_DATABASE_URL: sqlite+aiosqlite:///./lumonox_ci_test.db
      LUMONOX_EVENT_STORE: duckdb
      LUMONOX_DUCKDB_PATH: ./.lumonox/ci-events.duckdb
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync environment
        run: uv sync --group dev

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy

      - name: Bandit
        run: uv run bandit -c pyproject.toml -r sdk/src/lumonox backend/src/lumonox_backend

      - name: pip-audit
        run: uv run pip-audit

      - name: Pytest (SQLite + coverage)
        run: uv run pytest --cov=lumonox --cov=lumonox_backend --cov-report=term-missing

      - name: Packaging smoke (lumonox-sdk wheel)
        run: uv build --package lumonox-sdk --wheel -o packaging-dist && rm -rf packaging-dist

      - name: Backend job smoke (alerts + retention once)
        run: |
          uv run python -m lumonox_backend.jobs alerts-once >/dev/null
          uv run python -m lumonox_backend.jobs retention-once >/dev/null

  python-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lumonox
          POSTGRES_PASSWORD: lumonox
          POSTGRES_DB: lumonox_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lumonox -d lumonox_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://lumonox:lumonox@127.0.0.1:5432/lumonox_ci
      BACKEND_TEST_DATABASE_URL: postgresql+asyncpg://lumonox:lumonox@127.0.0.1:5432/lumonox_ci
      LUMONOX_EVENT_STORE: duckdb
      LUMONOX_DUCKDB_PATH: ./.lumonox/ci-events-postgres.duckdb
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync environment
        run: uv sync --group dev

      - name: Pytest (Postgres backend)
        run: uv run pytest backend/tests -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: npm audit
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Bundle budget
        run: npm run check:bundle-budget

      - name: Install uv (backend wheel smoke)
        uses: astral-sh/setup-uv@v5

      - name: Backend wheel bundles dashboard export
        working-directory: ${{ github.workspace }}
        run: |
          uv build backend -o /tmp/ap-wheel-smoke
          unzip -l /tmp/ap-wheel-smoke/lumonox_api-*-py3-none-any.whl | grep -Fq "lumonox_backend/dashboard_static/index.html"

  browser-smoke:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite+aiosqlite:///./lumonox_e2e.db
      BACKEND_TEST_DATABASE_URL: sqlite+aiosqlite:///./lumonox_e2e_test.db
      LUMONOX_EVENT_STORE: duckdb
      LUMONOX_DUCKDB_PATH: ./.lumonox/e2e-events.duckdb
      LUMONOX_FRONTEND_STATIC_DIR: frontend/out
      DASHBOARD_AUTH_ENABLED: "true"
      DASHBOARD_AUTH_ALLOWED_EMAIL: e2e@example.com
      DASHBOARD_AUTH_MAGIC_LINK_DEV_EXPOSE_TOKEN: "true"
      INTERNAL_METRICS_BEARER_TOKEN: e2e-internal-token
      E2E_BASE_URL: http://127.0.0.1:8000/lumonox/ui
      E2E_DASHBOARD_EMAIL: e2e@example.com
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync environment
        run: uv sync --group dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: Build frontend static export
        run: npm run build
        working-directory: frontend

      - name: Start backend
        run: |
          uv run uvicorn lumonox_backend.main:app --app-dir backend/src --host 127.0.0.1 --port 8000 --log-level info &
          echo $! > /tmp/lumonox-api.pid

      - name: Wait for backend readiness
        run: |
          for i in {1..60}; do
            if curl -sf http://127.0.0.1:8000/ready > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "backend did not become ready" >&2
          exit 1

      - name: Playwright core smoke
        run: npm run test:e2e
        working-directory: frontend

      - name: Stop backend
        if: always()
        run: |
          if [ -f /tmp/lumonox-api.pid ]; then
            kill "$(cat /tmp/lumonox-api.pid)" || true
          fi
