name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-sqlite:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite+aiosqlite:///./autopulse_ci.db
      BACKEND_TEST_DATABASE_URL: sqlite+aiosqlite:///./autopulse_ci_test.db
      AUTOPULSE_EVENT_STORE: duckdb
      AUTOPULSE_DUCKDB_PATH: ./.autopulse/ci-events.duckdb
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync environment
        run: uv sync --group dev

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy

      - name: Bandit
        run: uv run bandit -c pyproject.toml -r sdk/src/autopulse backend/src/autopulse_backend

      - name: pip-audit
        run: uv run pip-audit

      - name: Pytest (SQLite + coverage)
        run: uv run pytest --cov=autopulse --cov=autopulse_backend --cov-report=term-missing

      - name: Backend job smoke (alerts + retention once)
        run: |
          uv run python -m autopulse_backend.jobs alerts-once >/dev/null
          uv run python -m autopulse_backend.jobs retention-once >/dev/null

  python-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: autopulse
          POSTGRES_PASSWORD: autopulse
          POSTGRES_DB: autopulse_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U autopulse -d autopulse_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://autopulse:autopulse@127.0.0.1:5432/autopulse_ci
      BACKEND_TEST_DATABASE_URL: postgresql+asyncpg://autopulse:autopulse@127.0.0.1:5432/autopulse_ci
      AUTOPULSE_EVENT_STORE: duckdb
      AUTOPULSE_DUCKDB_PATH: ./.autopulse/ci-events-postgres.duckdb
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync environment
        run: uv sync --group dev

      - name: Pytest (Postgres backend)
        run: uv run pytest backend/tests -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: npm audit
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
