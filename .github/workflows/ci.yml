name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: autopulse
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d autopulse"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/autopulse
      BACKEND_TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/autopulse
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync environment
        run: uv sync --group dev

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy

      - name: Bandit
        run: uv run bandit -c pyproject.toml -r sdk/src/autopulse backend/src/autopulse_backend

      - name: Pytest
        run: uv run pytest
