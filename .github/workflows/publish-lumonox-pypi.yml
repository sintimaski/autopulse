# Publishes the ``lumonox`` distribution (FastAPI API + bundled Next static export under ``/lumonox/ui/``).
# PyPI project name is ``lumonox`` (FastAPI ingest + bundled dashboard static export).
#
# Runs on pushes to ``main`` when backend or frontend sources change; uploads only when ``backend/pyproject.toml``
# ``version`` is not yet on PyPI (bump version to cut a release).
#
# Manual: Actions → Publish lumonox to PyPI → Run workflow.
#
# One-time PyPI: create project ``lumonox`` → trusted publisher for this workflow (environment ``pypi`` if used).
name: Publish lumonox to PyPI

on:
  push:
    branches: [main]
    paths:
      - "backend/pyproject.toml"
      - "backend/src/**"
      - "frontend/**"
      - ".github/workflows/publish-lumonox-pypi.yml"
  workflow_dispatch:

concurrency:
  group: lumonox-pypi-publish
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/lumonox/
    permissions:
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Decide whether to publish
        id: decide
        run: |
          set -euo pipefail
          VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('backend/pyproject.toml', 'rb'))['project']['version'])")
          echo "lumonox_version=${VERSION}"
          CODE=$(curl -sS -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/lumonox/${VERSION}/json")
          echo "pypi_version_probe_http=${CODE}"
          if [ "${CODE}" = "200" ]; then
            echo "publish=false" >> "${GITHUB_OUTPUT}"
            echo "::notice::Skipping PyPI upload: lumonox ${VERSION} already exists on PyPI. Bump backend/pyproject.toml version to release."
          elif [ "${CODE}" = "404" ]; then
            echo "publish=true" >> "${GITHUB_OUTPUT}"
            echo "::notice::Will publish lumonox ${VERSION} to PyPI."
          else
            echo "::error::Unexpected PyPI response (${CODE}) for lumonox ${VERSION}; not publishing."
            exit 1
          fi

      - name: Setup Node.js
        if: steps.decide.outputs.publish == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build dashboard static export
        if: steps.decide.outputs.publish == 'true'
        env:
          NEXT_PUBLIC_LUMONOX_API_BASE_URL: "http://127.0.0.1:8000"
          NEXT_PUBLIC_LUMONOX_DEV_API_ORIGIN: "http://127.0.0.1:8000"
        run: |
          npm ci
          npm run build
        working-directory: frontend

      - name: Install uv
        if: steps.decide.outputs.publish == 'true'
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Build sdist + wheel (bundled dashboard)
        if: steps.decide.outputs.publish == 'true'
        run: uv build backend --out-dir dist

      - name: Verify wheel contains dashboard export
        if: steps.decide.outputs.publish == 'true'
        run: |
          set -euo pipefail
          whl="$(ls dist/lumonox-*-py3-none-any.whl | head -1)"
          unzip -l "$whl" | grep -Fq "lumonox_backend/dashboard_static/index.html"

      - name: Upload to PyPI
        if: steps.decide.outputs.publish == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
