name: Release Gates

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

jobs:
  release-gates:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite+aiosqlite:///./lumonox_release_gates.db
      BACKEND_TEST_DATABASE_URL: sqlite+aiosqlite:///./lumonox_release_gates_test.db
      LUMONOX_EVENT_STORE: duckdb
      LUMONOX_DUCKDB_PATH: ./.lumonox/release-gates-events.duckdb
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Sync environment
        run: uv sync --group dev

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Run release gates script
        run: bash ./scripts/release_gates.sh
