name: Release Gates

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

jobs:
  release-gates:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: autopulse
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d autopulse"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/autopulse
      BACKEND_TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/autopulse
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Sync environment
        run: uv sync --group dev

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Run release gates script
        run: bash ./scripts/release_gates.sh
