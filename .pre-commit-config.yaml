repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.6
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.3
    hooks:
      - id: bandit
        args: ["-c", "pyproject.toml", "-r", "sdk/src/autopulse", "backend/src/autopulse_backend"]
        pass_filenames: false
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^sdk/src/autopulse/ui/
      - id: end-of-file-fixer
        exclude: ^sdk/src/autopulse/ui/
      - id: check-yaml
      - id: check-added-large-files
  - repo: local
    hooks:
      - id: backend-alembic-verify
        name: backend-alembic-verify
        entry: bash scripts/pre_commit_alembic.sh
        language: system
        pass_filenames: false
        files: ^backend/(alembic/|src/autopulse_backend/models/)
      - id: frontend-eslint
        name: frontend-eslint
        entry: npm --prefix frontend run lint
        language: system
        pass_filenames: false
        files: ^frontend/
      - id: frontend-typecheck
        name: frontend-typecheck
        entry: npm --prefix frontend run typecheck
        language: system
        pass_filenames: false
        files: ^frontend/
      # Next build + copy export into sdk/src/autopulse/ui for embedded wheels (replaces standalone frontend-build).
      - id: sdk-embedded-ui-bundle
        name: sdk-embedded-ui-bundle
        entry: bash -c 'AUTOPULSE_BUNDLE_SKIP_NPM_CI=1 exec bash scripts/bundle_embedded_dashboard_ui.sh'
        language: system
        pass_filenames: false
        files: ^frontend/|^scripts/bundle_embedded_dashboard_ui\.sh$
