[alembic]
script_location = alembic
path_separator = os
prepend_sys_path = ./src
# Overridden at runtime by alembic/env.py from get_settings() (loads backend/.env).
# Default app DB is SQLite under .autopulse/; Postgres requires DATABASE_URL in the environment.
sqlalchemy.url = sqlite:///./.autopulse/autopulse.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
