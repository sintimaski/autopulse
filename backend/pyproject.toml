[project]
name = "autopulse-backend"
version = "0.1.1"
description = "AutoPulse backend ingestion API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "python-dotenv>=1.0.0",
    "uvicorn>=0.32.0",
    "websockets>=12.0",
    "sqlalchemy>=2.0.36",
    "greenlet>=3.0.0",
    "asyncpg>=0.30.0",
    "psycopg[binary]>=3.3.3",
    "alembic>=1.14.0",
    "aiosqlite>=0.22.1",
    "duckdb>=1.1.3",
    "psutil>=6.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
# Parquet object storage with ``s3://`` URIs (``parquet_object_storage``); not needed for ``file://``.
parquet-s3 = [
    "boto3>=1.34.0",
]

[build-system]
requires = ["hatchling>=1.26.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autopulse_backend"]
