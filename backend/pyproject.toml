[project]
name = "lumonox"
version = "0.2.12"
description = "Lumonox FastAPI ingest API, dashboard, and static UI (import ``lumonox`` or ``lumonox_backend``)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "python-dotenv>=1.0.0",
    "uvicorn>=0.32.0",
    "websockets>=12.0",
    "sqlalchemy>=2.0.36",
    "greenlet>=3.0.0",
    "asyncpg>=0.30.0",
    "psycopg[binary]>=3.3.3",
    "alembic>=1.14.0",
    "mako>=1.3.12",  # CVE-2026-44307 (transitive via alembic)
    "aiosqlite>=0.22.1",
    "duckdb>=1.1.3",
    "psutil>=6.0.0",
    "httpx>=0.27.0",
    "urllib3>=2.7.0",  # CVE-2026-44431, CVE-2026-44432 (via botocore / dev transitive requests)
]

[project.optional-dependencies]
# Parquet object storage with ``s3://`` URIs (``parquet_object_storage``); not needed for ``file://``.
parquet-s3 = [
    "boto3>=1.34.0",
]

[project.urls]
Homepage = "https://github.com/sintimaski/lumonox"
Repository = "https://github.com/sintimaski/lumonox"
Documentation = "https://github.com/sintimaski/lumonox/blob/main/backend/README.md"
Issues = "https://github.com/sintimaski/lumonox/issues"

[build-system]
requires = ["hatchling>=1.26.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
# Ship the Next static export inside the extracted tree used for wheels (nested under ``packages``)—avoids editable-install
# breakage from wheel-only forced paths while keeping ``frontend/out`` out of Git.
[tool.hatch.build.targets.sdist.force-include]
"../frontend/out" = "src/lumonox_backend/dashboard_static"
# Mirror shim into the sdist tree so ``build_wheel`` from the sdist resolves ``wheel.force-include`` paths.
"packaging/lumonox_shim/__init__.py" = "packaging/lumonox_shim/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/lumonox_backend"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"
